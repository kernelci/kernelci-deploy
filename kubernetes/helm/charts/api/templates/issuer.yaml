{{- if .Values.issuer.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.issuer.name }}
  labels:
    {{- include "kernelci-api.labels" . | nindent 4 }}
spec:
  acme:
    server: {{ .Values.issuer.server | quote }}
    email: {{ .Values.issuer.email | quote }}
    privateKeySecretRef:
      name: {{ .Values.issuer.privateKeySecretName }}
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: {{ .Values.issuer.apiGatewayName }}
                namespace: {{ .Values.issuer.apiGatewayNamespace }}
                kind: Gateway
                group: gateway.networking.k8s.io
                sectionName: http
            podTemplate:
              spec:
                nodeSelector: {kubernetes.io/os: linux}
        selector:
          dnsNames: {{ .Values.gateway.hostnames | mustToJson }}
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: {{ .Values.issuer.pipelineGatewayName }}
                namespace: {{ .Values.issuer.pipelineGatewayNamespace }}
                kind: Gateway
                group: gateway.networking.k8s.io
                sectionName: http
            podTemplate:
              spec:
                nodeSelector: {kubernetes.io/os: linux}
        selector:
          dnsNames: {{ .Values.issuer.pipelineHostnames | mustToJson }}
{{- end }}
