{{- $component := index .Values.components "pipeline-kcidb" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-kcidb
  labels:
    {{- include "kernelci-pipeline.labels" . | nindent 4 }}
    app: pipeline-kcidb
spec:
  replicas: {{ dig "replicas" 1 $component }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: pipeline-kcidb}
  template:
    metadata:
      labels: {app: pipeline-kcidb}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      initContainers:
        - name: wait-for-api
          image: {{ .Values.waitForApi.image | quote }}
          command: [sh, -c, {{ printf "until curl --fail --silent --insecure %s; do echo 'Waiting for API endpoint...'; sleep 5; done" .Values.waitForApi.url | quote }}]
      containers:
        - name: pipeline-kcidb
          image: "{{ $component.image.repository }}:{{ $component.image.tag }}"
          imagePullPolicy: {{ $component.image.pullPolicy }}
          command: {{ toJson $component.command }}
          env:
            - name: KCI_API_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.apiToken }}, key: token}}
            - name: KCIDB_REST
              {{- if .Values.environment.kcidbRestSecretKey }}
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.pipeline }}, key: {{ .Values.environment.kcidbRestSecretKey }}}}
              {{- else }}
              valueFrom: {configMapKeyRef: {name: kernelci-pipeline-env, key: KCIDB_REST}}
              {{- end }}
            - {name: GOOGLE_APPLICATION_CREDENTIALS, value: /secrets/kcidb-credentials.json}
            {{- range $key, $value := $component.env }}
            - {name: {{ $key }}, value: {{ $value | quote }}}
            {{- end }}
          {{- with $component.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $component.healthPort }}
          livenessProbe:
            httpGet: {path: /health, port: {{ . }}, scheme: HTTP}
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          {{- end }}
          volumeMounts:
            - {name: secrets, mountPath: /secrets}
            - {name: config-volume, mountPath: /config}
            - {name: config-volume, mountPath: /home/kernelci/config}
      volumes:
        - name: secrets
          secret: {secretName: {{ .Values.secrets.pipeline }}}
        - name: config-volume
          configMap: {name: {{ include "kernelci-pipeline.configMapName" . }}}
