apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-backing-storage
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard-rwo
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
spec:
  type: ClusterIP
  ports:
  - { name: nfs-tcp,   port: 2049, protocol: TCP }
  - { name: nfs-udp,   port: 2049, protocol: UDP }
  - { name: rpc-tcp,   port: 111,  protocol: TCP }
  - { name: rpc-udp,   port: 111,  protocol: UDP }
  - { name: mountd-tcp,port: 20048,protocol: TCP }
  - { name: mountd-udp,port: 20048,protocol: UDP }
  selector:
    app: nfs-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nfs-server
  template:
    metadata:
      labels:
        app: nfs-server
    spec:
      containers:
      - name: nfs-server
        image: gcr.io/google_containers/volume-nfs:0.8
        env:
        - name: EXPORT_OPTIONS          # overrides /etc/exports
          value: "rw,insecure,no_subtree_check,no_root_squash"
        ports:
        - containerPort: 2049
        securityContext:
          privileged: true
          capabilities:
            add:
              - SYS_ADMIN
              - SETPCAP
        volumeMounts:
        - mountPath: /exports
          name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: nfs-backing-storage
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: shared-data-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: nfs-server.default.svc.cluster.local
    path: "/exports"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-data
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 50Gi
  volumeName: shared-data-pv
  storageClassName: ""
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: file-sync
  namespace: default
spec:
  schedule: "5 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: fetch
            image: curlimages/curl:8.11.1
            command:
            - sh
            - -c
            - |
              set -eu
              URL=https://storage.kernelci.org/linux-firmware.tar.gz
              DST=/data/linux-firmware.tar.gz
              ETAG=/data/.linux-firmware.etag
              TMP=$(mktemp /data/.linux-firmware.tar.gz.XXXXXX)
              TMP_ETAG=$(mktemp /data/.linux-firmware.etag.XXXXXX)
              trap 'rm -f "$TMP" "$TMP_ETAG"' EXIT HUP INT TERM
              # A missing archive must be fetched even if an old ETag remains.
              set -- --etag-save "$TMP_ETAG" -o "$TMP" -w '%{http_code}'
              if [ -s "$DST" ] && [ -s "$ETAG" ]; then
                set -- "$@" --etag-compare "$ETAG"
              fi
              STATUS=$(curl -fsSL --retry 3 "$@" "$URL")
              case "$STATUS" in
                304)
                  [ -s "$DST" ] || exit 1
                  echo "linux-firmware.tar.gz unchanged"
                  exit 0
                  ;;
                200) ;;
                *) echo "Unexpected HTTP status: $STATUS" >&2; exit 1 ;;
              esac
              # Never publish an empty, interrupted or corrupt download.
              gzip -t "$TMP"
              chmod 644 "$TMP"
              # Both files are on the shared volume, making the rename atomic.
              # SMB can temporarily refuse replacement while a build holds DST open.
              n=0
              until mv -f "$TMP" "$DST"; do
                n=$((n + 1))
                [ "$n" -lt 60 ] || exit 1
                sleep 10
              done
              mv -f "$TMP_ETAG" "$ETAG"
              echo "linux-firmware.tar.gz updated"
              ls -l "$DST"
            volumeMounts:
            - name: data
              mountPath: /data
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: shared-data
