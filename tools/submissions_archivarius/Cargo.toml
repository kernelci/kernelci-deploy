[package]
name = "submissions_archivarius"
version = "1.0.1"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
tar = "0.4"
tokio = { version = "1", features = ["full"] }
xz2 = "0.1"

[package.metadata.deb]
name = "submissions-archivarius"
maintainer = "KernelCI <kernelci@lists.linux.dev>"
copyright = "KernelCI project"
extended-description = "Archives KernelCI submission JSON files into compressed .tar.xz bundles."
section = "utility"
priority = "optional"
depends = "$auto, adduser"
assets = [
    ["target/release/submissions_archivarius", "usr/bin/", "755"],
]
maintainer-scripts = "debian/"
systemd-units = { unit-name = "submissions-archivarius", unit-scripts = "debian/", enable = true, start = true }
