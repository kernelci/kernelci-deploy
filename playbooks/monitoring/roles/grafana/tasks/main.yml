# Grafana datasource and dashboards, provisioned from this repository.
#
# Every file under files/dashboards/<Folder>/ is copied into the provisioning
# tree that the compose file bind-mounts into the container, and shows up in
# Grafana folder <Folder>. Files removed from the repository are removed from
# the host too, so the repository is the complete list. Legacy/ holds the
# thirteen dashboards extracted from the original grafana.db.
#
# It deliberately does not manage the compose stack, the Kubernetes
# credentials in /srv/monitoring/config and /srv/monitoring/k8suser, or the
# admin password (kept in /root/grafana-admin-password on the host).
- name: Check the monitoring stack is deployed
  ansible.builtin.stat:
    path: "{{ monitoring_dir }}/docker-compose.yml"
  register: monitoring_compose

- name: Require the monitoring stack
  ansible.builtin.fail:
    msg: >-
      {{ monitoring_dir }}/docker-compose.yml is missing. This role manages
      Grafana's dashboards on an existing monitoring host; it does not deploy
      the stack itself.
  when: not monitoring_compose.stat.exists

- name: Ensure the provisioning directories exist
  ansible.builtin.file:
    path: "{{ grafana_provisioning_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - alerting
    - dashboards
    - datasources
    - "{{ grafana_dashboards_subdir }}"

- name: Configure the Grafana datasource
  ansible.builtin.template:
    src: datasource.yml.j2
    dest: "{{ grafana_provisioning_dir }}/datasources/datasource.yml"
    owner: root
    group: root
    mode: '0644'
  notify: Restart grafana

- name: Configure the dashboard provider
  ansible.builtin.template:
    src: dashboard-provider.yml.j2
    dest: "{{ grafana_provisioning_dir }}/dashboards/dashboard.yml"
    owner: root
    group: root
    mode: '0644'
  notify: Restart grafana

- name: Deploy the dashboards
  # No restart: Grafana rescans the directory every
  # grafana_dashboards_update_interval seconds.
  ansible.builtin.copy:
    src: dashboards/
    dest: "{{ grafana_provisioning_dir }}/{{ grafana_dashboards_subdir }}/"
    owner: root
    group: root
    mode: '0644'
    directory_mode: '0755'

- name: List the dashboards in the repository
  # Not the fileglob lookup: it only expands wildcards in the file name, so
  # files/dashboards/*/*.json matches nothing and every dashboard on the host
  # looks stale.
  ansible.builtin.find:
    paths: "{{ role_path }}/files/dashboards"
    patterns: "*.json"
    recurse: true
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  register: grafana_repo

- name: List the dashboards on the host
  ansible.builtin.find:
    paths: "{{ grafana_provisioning_dir }}/{{ grafana_dashboards_subdir }}"
    patterns: "*.json"
    recurse: true
  register: grafana_deployed

- name: Remove dashboards no longer in the repository
  ansible.builtin.file:
    path: "{{ grafana_dashboards_root }}/{{ item }}"
    state: absent
  loop: "{{ grafana_on_host | difference(grafana_in_repo) }}"
  vars:
    grafana_dashboards_root: "{{ grafana_provisioning_dir }}/{{ grafana_dashboards_subdir }}"
    grafana_on_host: >-
      {{ grafana_deployed.files | map(attribute='path')
         | map('relpath', grafana_dashboards_root) | list }}
    grafana_in_repo: >-
      {{ grafana_repo.files | map(attribute='path')
         | map('relpath', role_path ~ '/files/dashboards') | list }}

# Alerting. Rules come from files/alerting; where they are delivered (Discord
# webhook, email recipients, SMTP relay) from a file on the host, which the
# first run creates with empty values. Until it is filled in, the rules run
# and show in Grafana, but notify nobody.
- name: Create the alert delivery settings file
  ansible.builtin.copy:
    src: alerting-secrets.yml
    dest: "{{ grafana_alerting_secrets_file }}"
    owner: root
    group: root
    mode: '0600'
    force: false

- name: Read the alert delivery settings
  ansible.builtin.slurp:
    src: "{{ grafana_alerting_secrets_file }}"
  register: grafana_alerting_raw
  # In check mode on a fresh host the file was not actually created.
  failed_when: false
  no_log: true

- name: Parse the alert delivery settings
  # Missing keys fall back to empty, so a trimmed-down file still works.
  ansible.builtin.set_fact:
    grafana_alerting: >-
      {{ {'discord_webhook_url': '', 'email_to': [], 'smtp_host': '',
          'smtp_from_address': ''}
         | combine(grafana_alerting_raw.content | default('') | b64decode | from_yaml or {}) }}
  no_log: true

- name: Deploy the alert rules and notification templates
  # Careful: a provisioning file Grafana rejects stops Grafana from starting
  # at its next restart, not just alerting.
  ansible.builtin.copy:
    src: "alerting/{{ item }}"
    dest: "{{ grafana_provisioning_dir }}/alerting/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - rules.yml
    - templates.yml
  register: grafana_alert_rules

- name: Deploy the alert contact points and notification policy
  # Holds the webhook URL: readable by the container's grafana user only.
  ansible.builtin.template:
    src: alerting-notifications.yml.j2
    dest: "{{ grafana_provisioning_dir }}/alerting/notifications.yml"
    owner: root
    group: "{{ grafana_container_gid }}"
    mode: '0640'
  register: grafana_alert_notifications
  no_log: true

- name: Report the alert channels
  ansible.builtin.debug:
    msg: >-
      Alerts go to: {{ grafana_alert_receivers | join(', ') if grafana_alert_receivers
      else 'nobody yet - fill in ' ~ grafana_alerting_secrets_file }}

- name: Configure Grafana settings
  # Recreated, not restarted, by the handler: environment changes only take
  # effect on a new container.
  ansible.builtin.template:
    src: docker-compose.override.yml.j2
    dest: "{{ monitoring_dir }}/docker-compose.override.yml"
    owner: root
    group: root
    mode: '0600'
  notify: Recreate grafana
  no_log: true

# Folder permissions are set before the handler recreates Grafana with
# anonymous access on, so a private folder is never briefly public.
- name: Read the Grafana admin password
  ansible.builtin.slurp:
    src: "{{ grafana_admin_password_file }}"
  register: grafana_admin_password
  no_log: true

- name: Reload the alerting provisioning
  # Grafana only reads provisioning at startup otherwise. Done before the
  # folder permissions so the rules' folder exists and is made private in the
  # same run.
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/admin/provisioning/alerting/reload"
    method: POST
    url_username: admin
    url_password: "{{ grafana_admin_password.content | b64decode | trim }}"
    force_basic_auth: true
    status_code: 200
  when:
    - grafana_alert_rules is changed or grafana_alert_notifications is changed
    - not ansible_check_mode

- name: List the Grafana folders
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/folders"
    url_username: admin
    url_password: "{{ grafana_admin_password.content | b64decode | trim }}"
    force_basic_auth: true
  register: grafana_folders
  check_mode: false

- name: Read the folder permissions
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/folders/{{ item.uid }}/permissions"
    url_username: admin
    url_password: "{{ grafana_admin_password.content | b64decode | trim }}"
    force_basic_auth: true
  loop: "{{ grafana_folders.json }}"
  loop_control:
    label: "{{ item.title }}"
  register: grafana_folder_permissions
  check_mode: false

- name: Grant viewers access to public folders only
  # The POST replaces the folder's permission list. Editors keep edit rights
  # everywhere; Admins always have full access.
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/folders/{{ item.item.uid }}/permissions"
    method: POST
    url_username: admin
    url_password: "{{ grafana_admin_password.content | b64decode | trim }}"
    force_basic_auth: true
    body_format: json
    body:
      items: >-
        {{ ([{'role': 'Viewer', 'permission': 1}] if public else [])
           + [{'role': 'Editor', 'permission': 2}] }}
  loop: "{{ grafana_folder_permissions.results }}"
  loop_control:
    label: "{{ item.item.title }}: {{ 'public' if public else 'private' }}"
  vars:
    public: "{{ grafana_public and item.item.title in grafana_public_folders }}"
    viewer_now: "{{ item.json | selectattr('role', 'defined') | selectattr('role', 'equalto', 'Viewer') | list | length > 0 }}"
  when: public | bool != viewer_now | bool
  changed_when: true

- name: Apply any pending restart
  ansible.builtin.meta: flush_handlers

- name: Check Grafana answers
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/health"
    method: GET
    status_code: 200
  register: grafana_health
  changed_when: false
  retries: 5
  delay: 5
  until: grafana_health.status == 200
  when: not ansible_check_mode

- name: Report the Grafana version
  ansible.builtin.debug:
    msg: "grafana {{ grafana_health.json.version | default('?') }}, database {{ grafana_health.json.database | default('?') }}"
  when: not ansible_check_mode
