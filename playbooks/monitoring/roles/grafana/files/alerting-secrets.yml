# Grafana alert delivery for the monitoring host. Read by kernelci-deploy
# playbooks/monitoring (grafana role); placed here once by the playbook and
# never overwritten. Fill in, then rerun:
#   ansible-playbook -i inventory.yaml main.yml --tags grafana
#
# A channel with an empty value is left out.

# Discord: channel settings > Integrations > Webhooks > Copy webhook URL.
discord_webhook_url: ""

# Email recipients, e.g. [kernelci-alerts@example.org, someone@example.org].
email_to: []

# SMTP relay Grafana sends the email through.
smtp_host: ""              # host:port, e.g. smtp.example.org:587
smtp_user: ""
smtp_password: ""
smtp_from_address: ""      # e.g. alerts@kernelci.org
smtp_from_name: KernelCI monitoring
# "" (STARTTLS if offered), MandatoryStartTLS, or NoStartTLS. Port 465
# (implicit TLS) works with "".
smtp_starttls_policy: ""
smtp_skip_verify: false
