# Scrape configuration and alerting rules for the VictoriaMetrics stack.
#
# prometheus.yml is the map of what the whole project monitors: node exporters
# on the KCIDB, dashboard, staging and docs hosts, the API and pipeline
# metrics endpoints, the ingester and Django workers, the Kubernetes exporter
# and the blackbox probes. It existed only on this host.
#
# These are configuration, not accumulated state, so unlike the Grafana
# dashboards they are managed outright: the repository is the source of truth
# and the files are copied verbatim.
- name: Check the monitoring stack is deployed
  ansible.builtin.stat:
    path: "{{ monitoring_dir }}/docker-compose.yml"
  register: vmstack_compose

- name: Require the monitoring stack
  ansible.builtin.fail:
    msg: >-
      {{ monitoring_dir }}/docker-compose.yml is missing. This role manages the
      configuration of an existing stack; it does not deploy the stack itself.
  when: not vmstack_compose.stat.exists

# These three files are bind-mounted into their containers individually, e.g.
#   /srv/monitoring/prometheus.yml -> vmagent:/etc/prometheus/prometheus.yml
# A single-file bind mount is bound to the *inode*, not the path. Ansible's
# copy is atomic - temp file plus rename - which produces a new inode, so the
# container carries on reading the original file forever. The role reported
# "changed", the handler reloaded, everything looked green, and vmagent was
# still serving a config from 2026-03-20 five months later.
#
# unsafe_writes does not help: it is only a fallback for when the atomic
# rename fails, so it still swapped the inode (seen again on 2026-10-10).
# Instead the file is staged next to the stack and copied over the live file
# with cp, which truncates and rewrites the existing file in place, keeping
# the inode. The alternative is to bind-mount the directory instead of the
# file (as the blackbox exporter does, which is why that one always worked) -
# but the compose file is not managed from this repository.
- name: Ensure the staging directory exists
  ansible.builtin.file:
    path: "{{ monitoring_dir }}/.staged"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Stage the bind-mounted configuration files
  ansible.builtin.copy:
    src: "{{ item.name }}"
    dest: "{{ monitoring_dir }}/.staged/{{ item.name }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ vmstack_bind_mounted }}"
  loop_control:
    label: "{{ item.name }}"

- name: Write the configuration files in place
  # cmp first so an unchanged file is not touched and no reload is triggered.
  ansible.builtin.shell:
    cmd: >-
      cmp -s .staged/{{ item.name }} {{ item.name }}
      || { cp .staged/{{ item.name }} {{ item.name }} && echo written; }
    chdir: "{{ monitoring_dir }}"
  loop: "{{ vmstack_bind_mounted }}"
  loop_control:
    label: "{{ item.name }}"
  register: vmstack_written
  changed_when: "'written' in vmstack_written.stdout"
  notify: "{{ item.handler }}"

- name: Set ownership of the configuration files
  # file only changes metadata, never the inode.
  ansible.builtin.file:
    path: "{{ monitoring_dir }}/{{ item.name }}"
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: '0644'
  loop: "{{ vmstack_bind_mounted }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure the blackbox exporter directory exists
  ansible.builtin.file:
    path: "{{ monitoring_dir }}/blackbox-exporter"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy the blackbox exporter modules
  # Notifies a reload: without it a module change sat on disk until the
  # container happened to restart, so the file in git and the behaviour of the
  # running probe could disagree indefinitely.
  ansible.builtin.copy:
    src: blackbox-exporter/blackbox.yml
    dest: "{{ monitoring_dir }}/blackbox-exporter/blackbox.yml"
    owner: root
    group: root
    mode: '0644'
  notify: Reload blackbox exporter

- name: Apply any pending reloads
  ansible.builtin.meta: flush_handlers

- name: Check which stack services are not running
  # The blackbox exporter has been down for months without anyone noticing,
  # which is precisely the sort of thing a run of this playbook should say out
  # loud rather than leave to a dashboard nobody opens.
  ansible.builtin.command:
    cmd: docker compose ps -a --format {{ '{{' }}.Service{{ '}}' }}/{{ '{{' }}.State{{ '}}' }}
    chdir: "{{ monitoring_dir }}"
  register: vmstack_ps
  changed_when: false
  check_mode: false

- name: Report stopped services
  ansible.builtin.debug:
    msg: >-
      Not running: {{ stopped | join(', ') }}. Scrape targets pointed at these
      collect nothing.
  vars:
    stopped: "{{ vmstack_ps.stdout_lines | reject('search', '/running') | list }}"
  when: stopped | length > 0
