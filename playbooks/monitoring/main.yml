# ansible-playbook -i inventory.yaml main.yml
# ansible-playbook -i inventory.yaml main.yml --tags grafana   # dashboards only
#
# The monitoring host. The grafana role provisions the datasource and every
# dashboard under roles/grafana/files/dashboards (one Grafana folder per
# subdirectory); the vmstack role manages scrape config and alerting.
- hosts: all
  gather_facts: true
  become: true
  roles:
    - role: grafana
      tags: grafana
    - role: vmstack
      tags: vmstack
