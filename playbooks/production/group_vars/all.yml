# Public KernelCI MCP server (kci-dev mcp, streamable HTTP transport).
#
# Kept in group_vars rather than in roles/mcp/vars so that the webserver role,
# which runs first and publishes the endpoint, sees the same port and limits.
#
# The server is reachable from the internet through nginx, and kci-dev's HTTP
# transport has no authentication layer of its own, so the configuration
# deliberately carries no `pipeline` URL and no `token`. kci-dev only registers
# the job-changing tools (retry_job, trigger_checkout) when both of those are
# set, which makes this deployment structurally read-only: dashboard queries
# plus Maestro node lookups, nothing that can start or retry a job.
mcp_user: kci-mcp
mcp_home: /srv/kci-mcp
mcp_bind: 127.0.0.1
mcp_port: 8000

# Where kci-dev comes from.
#   pypi  the released package, pinned with mcp_kci_dev_version
#   git   a repository and ref, for running an MCP change that has not been
#         released yet - a fork and a work branch are as valid here as upstream
# A ref is resolved to a commit before it is installed, and what is already
# installed is read back out of the virtualenv, so "the branch moved" is
# something the role and the update timer can both see. Switching source or
# ref reinstalls on the next run; nothing else does, so a routine run is still
# a no-op.
mcp_source: pypi
mcp_git_repo: https://github.com/kernelci/kci-dev.git
mcp_git_ref: main

# Empty installs the latest release from PyPI; pin a version to freeze it.
# Only consulted when mcp_source is pypi - a git source is pinned by its ref.
mcp_kci_dev_version: ""
# Set to true to reinstall kci-dev on the next run even if nothing changed.
mcp_upgrade: false

# Weekly self-verifying upgrade: reinstall from the configured source, restart,
# check the server still answers, roll back to what was running if it does not.
# Disabled automatically when the source names one exact thing: a pinned
# release, or a commit id in mcp_git_ref.
mcp_auto_update: true
mcp_update_schedule: "Sun 04:00"
mcp_update_splay: 30m

mcp_instance: production
mcp_dashboard_api: "https://dashboard.kernelci.org/api/"
mcp_maestro_api: "https://kernelci-api.westus3.cloudapp.azure.com/"

# nginx side, consumed by the webserver role
mcp_rate_limit: 10r/s
mcp_rate_limit_burst: 20
# Concurrent streams per client. MCP responses are long-lived, so this is
# what stops one client from pinning the single backend process.
mcp_conn_limit: 8
mcp_limit_status: 429
mcp_stream_timeout: 3600s
