- name: Update apt cache
  apt: update_cache=yes cache_valid_time=3600

- name: Install packages
  # Production runs docker-ce from download.docker.com with the compose
  # plugin (docker compose), not the Debian docker.io/docker-compose pair.
  apt: name={{ item }}
  with_items:
    - git
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-compose-plugin
    - python3-pip
    - python3-venv
    - curl
    - libssl-dev
    - pkg-config
    - rsync

#- name: Add to fstab
#  ansible.builtin.lineinfile:
#    path: /etc/fstab
#    line: "UUID=64d72737-f1de-4f67-a22a-f693a79f228f /data ext4 defaults,nofail 0 2"
#    state: present

- name: Change ssh port to 22022
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Port 22022"
    state: present

- name: Restart ssh service
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Mount the disk
  ansible.posix.mount:
    path=/data src=UUID=64d72737-f1de-4f67-a22a-f693a79f228f fstype=ext4 state=mounted
  # its ok if it fails (for simulation purposes)
  ignore_errors: true


- name: Create data directories if they don't exist
  ansible.builtin.file:
    path: "{{ item.root_path }}"
    state: directory
  loop: "{{ vhosts | selectattr('root_path', 'defined') | list }}"
  loop_control:
    label: "{{ item.vhost_name }}"

- name: Create data directory for storage
  ansible.builtin.file: path=/data/storage state=directory
