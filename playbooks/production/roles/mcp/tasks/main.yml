# kci-dev MCP server, running under systemd in its own virtualenv and bound to
# the loopback interface. nginx (webserver role) publishes it.
- name: Install the python tooling for the MCP virtualenv
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Create the MCP service user
  ansible.builtin.user:
    name: "{{ mcp_user }}"
    home: "{{ mcp_home }}"
    shell: /usr/sbin/nologin
    system: yes
    create_home: no

- name: Create the MCP home directory
  ansible.builtin.file:
    path: "{{ mcp_home }}"
    state: directory
    owner: "{{ mcp_user }}"
    group: "{{ mcp_user }}"
    mode: '0750'

- name: Create the MCP virtualenv
  # Installed as root on purpose: the service user only ever reads its own
  # code, it cannot rewrite the virtualenv it runs from.
  ansible.builtin.command: python3 -m venv {{ mcp_home }}/venv
  args:
    creates: "{{ mcp_home }}/venv/bin/python"

- name: Read the installed kci-dev version
  ansible.builtin.command: "{{ mcp_home }}/venv/bin/kci-dev --version"
  register: kci_dev_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install kci-dev with the mcp extra
  # Debian 13 marks the system interpreter externally managed, so kci-dev
  # lives in the virtualenv above rather than in /usr/lib/python3.
  ansible.builtin.pip:
    name: "kci-dev[mcp]{{ ('==' + mcp_kci_dev_version) if mcp_kci_dev_version else '' }}"
    virtualenv: "{{ mcp_home }}/venv"
    state: "{{ 'latest' if (mcp_upgrade and not mcp_kci_dev_version) else 'present' }}"
  when: >-
    kci_dev_installed.rc != 0
    or (mcp_upgrade | bool)
    or (mcp_kci_dev_version | length > 0
        and mcp_kci_dev_version not in kci_dev_installed.stdout)
  notify: Restart kci-mcp

- name: Configure kci-dev for the public read-only instance
  ansible.builtin.template:
    src: kci-dev.toml.j2
    dest: "{{ mcp_home }}/kci-dev.toml"
    owner: "{{ mcp_user }}"
    group: "{{ mcp_user }}"
    mode: '0640'
  notify: Restart kci-mcp

- name: Install the kci-mcp systemd unit
  ansible.builtin.template:
    src: kci-mcp.service.j2
    dest: /etc/systemd/system/kci-mcp.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart kci-mcp

- name: Enable and start kci-mcp
  ansible.builtin.systemd:
    name: kci-mcp
    enabled: yes
    state: started
    daemon_reload: yes

# Scheduled upgrades. Skipped when a version is pinned: a pin is a decision
# to stay put, and a timer that undoes it would be a trap.
- name: Install the kci-dev update script
  ansible.builtin.template:
    src: kci-mcp-update.sh.j2
    dest: "{{ mcp_home }}/update.sh"
    owner: root
    group: root
    mode: '0755'
  when: mcp_auto_update | bool and mcp_kci_dev_version | length == 0

- name: Install the kci-dev update units
  ansible.builtin.template:
    src: "kci-mcp-update.{{ item }}.j2"
    dest: "/etc/systemd/system/kci-mcp-update.{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - service
    - timer
  when: mcp_auto_update | bool and mcp_kci_dev_version | length == 0

- name: Enable the kci-dev update timer
  ansible.builtin.systemd:
    name: kci-mcp-update.timer
    enabled: yes
    state: started
    daemon_reload: yes
  when: mcp_auto_update | bool and mcp_kci_dev_version | length == 0

- name: Disable the kci-dev update timer when updates are pinned or turned off
  ansible.builtin.systemd:
    name: kci-mcp-update.timer
    enabled: no
    state: stopped
  failed_when: false
  when: not (mcp_auto_update | bool and mcp_kci_dev_version | length == 0)

- name: Apply any pending restart before checking the server
  ansible.builtin.meta: flush_handlers

- name: Wait for the MCP server to listen
  ansible.builtin.wait_for:
    host: "{{ mcp_bind }}"
    port: "{{ mcp_port }}"
    timeout: 60

- name: Check that the MCP server answers an initialize request
  ansible.builtin.uri:
    url: "http://{{ mcp_bind }}:{{ mcp_port }}/mcp"
    method: POST
    headers:
      Accept: "application/json, text/event-stream"
      Content-Type: application/json
    body_format: json
    body:
      jsonrpc: "2.0"
      id: 1
      method: initialize
      params:
        protocolVersion: "2025-06-18"
        capabilities: {}
        clientInfo:
          name: ansible
          version: "1"
    return_content: yes
    status_code: 200
  register: mcp_initialize
  changed_when: false

- name: Show the MCP server identity
  ansible.builtin.debug:
    msg: "{{ mcp_initialize.content | regex_search('\"serverInfo\":\\{[^}]*\\}') }}"
