# Virtual hosts served by the production web server (vm-production-2025).
#
# Supported per-vhost keys:
#   vhost_name      mandatory, server_name and config file name
#   root_path       serve files from this directory (static vhost)
#   fancyindex      enable libnginx-mod-http-fancyindex autoindex
#   cookie_gate     require the JS/cookie challenge before serving content
#   immutable_cache emit Cache-Control for date-versioned artifacts, driven by
#                   the $storage_cache_control map in conf.d/kernelci-cache.conf
#   decommissioned  serve HTTP 410 with this message instead of content
#   port            reverse proxy to http://127.0.0.1:<port>
#   max_body_size   client_max_body_size for upload-heavy proxies
#   proxy_timeout   client_body/proxy_read timeout for slow proxies
#   proxy_upstream  named nginx upstream instead of 127.0.0.1:<port>
#   proxy_keepalive use HTTP/1.1 pooled connections to the named upstream
#   access_log_format  optional nginx log format appended to access_log
#   streaming       disable proxy buffering (SSE / streamable HTTP)
#   stream_timeout  proxy_read/send timeout for a streaming vhost
#   proxy_host_header  Host header to send upstream, when the backend
#                   validates it (default: the public $host)
#   rate_limit      apply the named limit_req zone, plus its <name>_conn
#                   limit_conn zone (see kernelci-limits.conf)
#   rate_limit_burst  burst allowance for that limit_req zone
#   conn_limit      concurrent connections per client for that zone
#   mcp_endpoint    also serve the MCP server under /mcp on this vhost
#   enabled         set to false to keep the vhost out of nginx and certbot
#
# All vhosts share the docs.kernelci.org certificate, which certbot expands
# to cover every name listed here.
nginx_cert_name: docs.kernelci.org
certbot_email: bot@kernelci.org

vhosts:
  - vhost_name: docs.kernelci.org
    root_path: /data/kernelci.org

  - vhost_name: storage.kernelci.org
    root_path: /data/storage.kernelci.org
    fancyindex: true
    cookie_gate: true
    immutable_cache: true

  - vhost_name: storage.chromeos.kernelci.org
    # Content was retired in 2025-06, the directory is kept for archival only.
    decommissioned: 'This storage has been decommissioned.\nPlease contact the KernelCI administrators if you need any content from here.\n'
    # Was the temporary home of the public MCP server while mcp.kernelci.org
    # had no DNS record. mcp.kernelci.org is live now and is where the server
    # is published; this stays only so clients that were given the temporary
    # URL keep working, and can be dropped once they have moved. The vhost
    # serves no content otherwise, so nothing else is at risk.
    mcp_endpoint: true

  - vhost_name: files.kernelci.org
    # kernelci-storage container, see the storage role
    port: 3000
    max_body_size: 10000M
    proxy_timeout: 600s
    proxy_upstream: kernelci_storage
    proxy_keepalive: true
    access_log_format: kci_timing

  - vhost_name: mcp.kernelci.org
    # Public read-only KernelCI MCP server, see the mcp role. The whole vhost
    # is the endpoint: the server exposes itself under /mcp, so clients use
    # https://mcp.kernelci.org/mcp.
    #
    # The limits are carried over from the group_vars the mcp role and the
    # /mcp location on storage.chromeos.kernelci.org already use, rather than
    # left to the template defaults, so one place still governs both.
    port: "{{ mcp_port | default(8000) }}"
    proxy_host_header: "127.0.0.1:{{ mcp_port | default(8000) }}"
    streaming: true
    stream_timeout: "{{ mcp_stream_timeout | default('3600s') }}"
    rate_limit: mcp
    rate_limit_burst: "{{ mcp_rate_limit_burst | default(20) }}"
    conn_limit: "{{ mcp_conn_limit | default(8) }}"
