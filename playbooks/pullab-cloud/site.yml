# Provision the pullab_cloud poller host.
#
#   ansible-playbook -i inventory.yaml site.yml
#
# Secrets (UNIFIED_TOKEN, AWS keys) come from group_vars/vault.yml — see
# group_vars/vault.yml.example. The role asserts on them before it touches the
# service configuration. The shared trust-store update runs before this check;
# missing secrets stop the role before it changes the poller configuration.
# Set pullab_manage_aws_credentials=false if the host authenticates with an IAM
# instance profile and has no static keys to place.
- name: pullab_cloud poller
  hosts: pullab_poller
  gather_facts: true
  become: true
  pre_tasks:
    - name: Update the system CA trust store
      ansible.builtin.import_tasks: ../tasks/trust-store.yml
      tags: trust-store
  roles:
    - pullab_cloud
